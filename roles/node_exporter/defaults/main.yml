---
node_exporter_version: "1.9.1"
node_exporter_arch: >-
  {{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armv7'}.get(ansible_architecture, ansible_architecture) }}
node_exporter_base_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}"
node_exporter_archive: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
# get_url downloads this file and looks up the archive's line in it.
node_exporter_checksum: "sha256:{{ node_exporter_base_url }}/sha256sums.txt"

node_exporter_user: node_exporter
node_exporter_group: node_exporter
node_exporter_download_dir: /usr/local/src
node_exporter_binary: /usr/local/bin/node_exporter
node_exporter_textfile_dir: /var/lib/node_exporter/textfile_collector

node_exporter_listen_ip: 0.0.0.0
node_exporter_port: 9100
node_exporter_listen_address: "{{ node_exporter_listen_ip }}:{{ node_exporter_port }}"

# Collectors to switch on or off in addition to the upstream defaults.
node_exporter_enabled_collectors: []
node_exporter_disabled_collectors: []
node_exporter_extra_args: []

# ufw: allow the metrics port from these networks only.
node_exporter_manage_firewall: true
node_exporter_allowed_cidrs:
  - 10.0.0.0/8
