---
ssh_hardening_port: 22
# Leave empty to listen on all addresses.
ssh_hardening_listen_addresses: []

# Name of the drop-in. It sorts before 50-cloud-init.conf on purpose: sshd
# keeps the first value it sees for each keyword.
ssh_hardening_dropin_name: 00-baseline.conf

# Authentication
ssh_hardening_password_authentication: false
ssh_hardening_permit_root_login: "no"
ssh_hardening_max_auth_tries: 3
ssh_hardening_max_sessions: 10
ssh_hardening_login_grace_time: 30
# Only members of these groups may log in. Keep in sync with users_admin_group.
ssh_hardening_allow_groups:
  - admins
ssh_hardening_allow_users: []

# Session
ssh_hardening_client_alive_interval: 300
ssh_hardening_client_alive_count_max: 2
ssh_hardening_allow_agent_forwarding: false
ssh_hardening_allow_tcp_forwarding: false
ssh_hardening_x11_forwarding: false
ssh_hardening_permit_tunnel: false
# Path to a banner file, or empty for none.
ssh_hardening_banner: ""

# Logging. VERBOSE records the key fingerprint used for each login.
ssh_hardening_log_level: VERBOSE

# Crypto. Modern algorithms only; every entry is supported by OpenSSH 8.9+
# (Ubuntu 22.04), 9.2 (Debian 12) and 9.6 (Ubuntu 24.04).
ssh_hardening_kex_algorithms:
  - sntrup761x25519-sha512@openssh.com
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - diffie-hellman-group16-sha512
  - diffie-hellman-group18-sha512
  - diffie-hellman-group-exchange-sha256
ssh_hardening_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr
ssh_hardening_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - umac-128-etm@openssh.com
ssh_hardening_host_key_algorithms:
  - ssh-ed25519
  - ssh-ed25519-cert-v01@openssh.com
  - rsa-sha2-512
  - rsa-sha2-512-cert-v01@openssh.com
  - rsa-sha2-256
  - rsa-sha2-256-cert-v01@openssh.com

# Extra keyword/value pairs appended verbatim to the drop-in.
ssh_hardening_extra_settings: {}

# Ubuntu 24.04 starts sshd through ssh.socket, which ignores Port and
# ListenAddress in sshd_config. Disabling the socket restores the classic
# behaviour so the settings above are honoured.
ssh_hardening_disable_socket_activation: true

# Lockout pre-check. Before password authentication is turned off, the role
# looks for at least one authorized_keys file with a public key under these
# paths and checks that every group in AllowGroups exists with members.
ssh_hardening_lockout_check_paths:
  - /home
  - /root
ssh_hardening_skip_lockout_check: false
