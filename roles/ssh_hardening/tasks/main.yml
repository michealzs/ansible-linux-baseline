---
- name: Ensure openssh-server is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure the sshd privilege separation directory exists
  # sshd -t refuses to parse any config without /run/sshd and exits 255 with
  # "Missing privilege separation directory". systemd creates it from the unit's
  # RuntimeDirectory, so it is missing until sshd has run once. Every validate
  # step below depends on it.
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Run the lockout pre-check before password authentication is disabled
  ansible.builtin.include_tasks: precheck.yml
  when:
    - not ssh_hardening_password_authentication | bool
    - not ssh_hardening_skip_lockout_check | bool

- name: Ensure sshd_config includes the drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*Include\s+/etc/ssh/sshd_config\.d/\*\.conf'
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify:
    - Validate sshd configuration
    - Restart sshd

- name: Ensure the drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the sshd hardening drop-in
  ansible.builtin.template:
    src: sshd_config_dropin.conf.j2
    dest: "/etc/ssh/sshd_config.d/{{ ssh_hardening_dropin_name }}"
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify:
    - Validate sshd configuration
    - Restart sshd

- name: Check whether ssh.socket exists
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/ssh.socket
  register: ssh_hardening_socket_unit

- name: Disable ssh.socket so sshd reads Port and ListenAddress from its config
  ansible.builtin.systemd_service:
    name: ssh.socket
    enabled: false
    state: stopped
  when:
    - ssh_hardening_disable_socket_activation | bool
    - ssh_hardening_socket_unit.stat.exists
  notify: Restart sshd

- name: Ensure the ssh service is enabled and running
  ansible.builtin.systemd_service:
    name: ssh
    enabled: true
    state: started
