---
- name: Check whether the swap file already exists
  ansible.builtin.stat:
    path: "{{ common_swap_path }}"
  register: common_swap_file

- name: Allocate the swap file
  ansible.builtin.command:
    cmd: "fallocate -l {{ common_swap_size_mb }}M {{ common_swap_path }}"
    creates: "{{ common_swap_path }}"

- name: Restrict swap file permissions
  ansible.builtin.file:
    path: "{{ common_swap_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Format the swap file
  ansible.builtin.command:
    cmd: "mkswap {{ common_swap_path }}"
  when: not common_swap_file.stat.exists
  changed_when: true

- name: Add the swap file to fstab
  ansible.posix.mount:
    src: "{{ common_swap_path }}"
    path: none
    fstype: swap
    opts: sw
    state: present

- name: Read the list of active swap devices
  ansible.builtin.command:
    cmd: swapon --show=NAME --noheadings
  register: common_swap_active
  changed_when: false

- name: Activate the swap file
  ansible.builtin.command:
    cmd: "swapon {{ common_swap_path }}"
  when: common_swap_path not in common_swap_active.stdout_lines
  changed_when: true

- name: Set vm.swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ common_swappiness }}"
    sysctl_file: "{{ common_sysctl_file }}"
    sysctl_set: true
    reload: false
    state: present
