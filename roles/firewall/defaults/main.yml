---
firewall_default_incoming: deny
firewall_default_outgoing: allow
firewall_default_routed: deny

# SSH is allowed with "limit": more than 6 connections in 30 seconds from one
# address are dropped.
firewall_ssh_port: "{{ ssh_hardening_port | default(22) }}"
firewall_ssh_rate_limit: true

# Extra rules. Each entry takes the same keys as community.general.ufw:
#   - { port: 443, proto: tcp, comment: "HTTPS" }
#   - { port: 5432, proto: tcp, src: 10.0.0.0/8, comment: "PostgreSQL from LAN" }
#   - { port: 8080, proto: tcp, rule: deny }
firewall_rules: []

# off, low, medium, high, full
firewall_logging: low
firewall_ipv6: true
