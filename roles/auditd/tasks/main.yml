---
- name: Install auditd
  ansible.builtin.apt:
    name:
      - auditd
      - audispd-plugins
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Apply auditd.conf settings
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^\s*{{ item.key }}\s*='
    line: "{{ item.key }} = {{ item.value }}"
  loop: "{{ auditd_conf_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"
  notify: Restart auditd

- name: Deploy the baseline audit rules
  ansible.builtin.template:
    src: baseline.rules.j2
    dest: "{{ auditd_rules_file }}"
    owner: root
    group: root
    mode: "0640"
  notify: Restart auditd

- name: Ensure auditd is enabled and running
  ansible.builtin.systemd_service:
    name: auditd
    enabled: true
    state: started
