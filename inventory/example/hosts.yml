---
# Example inventory. Copy this directory to inventory/<env>/ and replace the
# hosts. Every host gets the baseline; membership of docker_hosts and
# monitoring_agents adds the docker and node_exporter roles.

all:
  children:
    baseline:
      hosts:
        web-01.example.com:
        web-02.example.com:
        db-01.example.com:
        mon-01.example.com:
    docker_hosts:
      hosts:
        web-01.example.com:
        web-02.example.com:
    monitoring_agents:
      hosts:
        web-01.example.com:
        web-02.example.com:
        db-01.example.com:
        mon-01.example.com:
